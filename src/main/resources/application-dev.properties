####################### RabbitMQ #####################
# MQ发消息
spring.cloud.stream.bindings.test_output.destination=test.exchange
spring.cloud.stream.rabbit.bindings.test_output.producer.routingKeyExpression=headers["routing-key"]
# MQ接收消息
spring.cloud.stream.bindings.test_input.destination=test.exchange
spring.cloud.stream.bindings.test_input.group=queue.test
spring.cloud.stream.rabbit.bindings.test_input.consumer.bindingRoutingKey=test.routingKey
# MQ接收延迟消息发送
spring.cloud.stream.bindings.delay_output.destination=delay.exchange
spring.cloud.stream.rabbit.bindings.delay_output.producer.delayed-exchange=true
# MQ接收延迟消息接收
spring.cloud.stream.bindings.delay_input.destination=delay.exchange
spring.cloud.stream.bindings.delay_input.group=delay.queue.test
spring.cloud.stream.rabbit.bindings.delay_input.consumer.delayed-exchange=true
